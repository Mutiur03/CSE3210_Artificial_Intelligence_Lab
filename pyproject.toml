[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# report/slide/docs generators hold long prose strings
"scripts/experiments.py" = ["E501"]
"scripts/build_*.py" = ["E501"]
"scripts/check_consistency.py" = ["E501"]
"scripts/diagrams.py" = ["E501"]
"scripts/find_demo_seeds.py" = ["E501"]
"scripts/content.py" = ["E501"]
